name: CI/CD Pipeline - Your Journey

# Dispara a pipeline em Pull Requests para a branch 'main' e em Pushes diretos na 'main'
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. Validação do Backend (API NestJS)
  # ============================================================================
  build_and_test_api:
    name: Backend (API) - Lint, Test & Build
    runs-on: ubuntu-latest
    
    # Define a pasta apps/api como diretório padrão para todos os comandos 'run' deste job
    defaults:
      run:
        working-directory: apps/api

    steps:
      # Baixa o código do repositório no runner do GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Configura o ambiente Node.js com cache do npm apontando para o lockfile da API
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      # Instala as dependências exatas a partir do package-lock.json (modo limpo e reprodutível)
      - name: Install dependencies
        run: npm ci

      # Valida a qualidade e padrões do código usando oxlint
      - name: Run lint
        run: npm run lint

      # Executa a suite de testes unitários com Vitest
      - name: Run tests
        run: npm test

      # Valida se a compilação do NestJS / TypeScript ocorre sem erros
      - name: Build API
        run: npm run build

  # ============================================================================
  # 2. Validação do Frontend (Web Next.js)
  # ============================================================================
  build_and_test_frontend:
    name: Frontend (Web) - Lint & Build
    runs-on: ubuntu-latest
    
    # Define a pasta apps/web como diretório padrão para todos os comandos 'run' deste job
    defaults:
      run:
        working-directory: apps/web

    steps:
      # Baixa o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # Configura o Node.js e cache de dependências do frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      # Instala dependências do Next.js
      - name: Install dependencies
        run: npm ci

      # Executa o ESLint no frontend
      - name: Run lint
        run: npm run lint

      # Executa o build de produção do Next.js (valida tipagem TypeScript e páginas)
      - name: Build frontend
        run: npm run build

  # ============================================================================
  # 3. Smoke test (sobe o projeto de verdade, migra e confere que responde)
  # ============================================================================
  smoke:
    name: Smoke - sobe, migra e responde
    runs-on: ubuntu-latest
    # So roda depois que lint, teste e build passaram. Nao adianta subir o
    # projeto se o codigo nem compila.
    needs: [build_and_test_api, build_and_test_frontend]
    # Generoso de proposito: no CI o build e sempre frio e leva alguns minutos.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sobe o compose inteiro, aplica as migracoes, confere que toda entidade
      # tem migracao correspondente, e que /health responde.
      #
      # Pega a classe de erro que lint, teste unitario e build nao pegam:
      # modulo nao registrado, rota que estoura, entidade sem tabela.
      - name: Sobe o projeto, aplica as migracoes e confere a saude
        run: make smoke

  # ============================================================================
  # 4. Deploy (Executado apenas na branch main e se os jobs anteriores passarem)
  # ============================================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    # Aguarda a validação com sucesso tanto da API quanto do Frontend
    needs: [build_and_test_api, build_and_test_frontend, smoke]
    # Executa apenas se o evento for um push na branch main (não roda em PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "Todos os testes e builds passaram com sucesso!"
          echo "Etapa de deploy pronta para configuração do ambiente de produção."

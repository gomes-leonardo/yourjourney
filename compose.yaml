# Descreve todos os servicos do projeto e como eles se enxergam.
# Nao rode este arquivo direto: use `make up`, que confere os pre-requisitos
# antes e espera os servicos responderem depois.
#
# Dentro desta rede, um servico chama o outro pelo NOME do servico
# (http://api:8080). "localhost", dentro de um conteiner, e o proprio conteiner.

name: yourjourney

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: yourjourney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./apps/api
      target: development
    container_name: yourjourney-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 8080
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CONFIRMATION_CODE_TTL_MINUTES: ${CONFIRMATION_CODE_TTL_MINUTES:-10}
      CONFIRMATION_CODE_MAX_ATTEMPTS: ${CONFIRMATION_CODE_MAX_ATTEMPTS:-5}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Monta o codigo de dentro do repositorio no conteiner, para que salvar
      # um arquivo recarregue a API sem precisar reconstruir a imagem.
      - ./apps/api/src:/app/src
      - ./apps/api/test:/app/test
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./apps/web
      target: development
    container_name: yourjourney-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # Endereco usado pelo Next no SERVIDOR, de conteiner para conteiner.
      API_INTERNAL_URL: http://api:8080
      # Endereco usado pelo NAVEGADOR do aluno, que esta fora do Docker.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-dados:
